<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a84d6">
<meta name="robots" content="noindex">
<title>Aquaminder Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --aqua: #1ba1e2; --deep: #0a5bd6; --violet: #7b5cff; --mint: #19c39c;
    --ink: #13223a; --muted: #6b7a90; --bg: #eef6fc; --card: #fff; --line: #dbe7f2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Poppins, system-ui, sans-serif; color: var(--ink); background: var(--bg); min-height: 100vh; }
  .hero { color: #fff; padding: 18px 16px 70px; background: linear-gradient(135deg, #00c6ff 0%, #0a84d6 45%, #6a5cff 100%); border-radius: 0 0 28px 28px; }
  .hero .in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .logo { background: #fff; border-radius: 14px; padding: 0 4px; }
  .logo img { display: block; height: 72px; margin: -14px 0; }
  .hero h1 { margin: 0; font-size: 20px; flex: 1; }
  .hero a, .hero button { color: #fff; font: 500 13px Poppins, sans-serif; background: rgba(255,255,255,.18); border: 0; padding: 8px 14px; border-radius: 10px; cursor: pointer; text-decoration: none; }
  main { max-width: 1100px; margin: -48px auto 0; padding: 0 16px 40px; }
  .panel { background: var(--card); border-radius: 22px; padding: 22px; box-shadow: 0 12px 32px rgba(10,91,214,.12); }
  .login { max-width: 380px; margin: 0 auto; }
  .login h2 { margin: 0 0 14px; font-size: 18px; }
  label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 10px; }
  input { display: block; width: 100%; margin-top: 4px; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 12px; font: 15px Poppins, sans-serif; color: var(--ink); background: #fbfdff; }
  input:focus { outline: none; border-color: var(--aqua); box-shadow: 0 0 0 4px rgba(27,161,226,.15); }
  .btn { padding: 12px 18px; border: 0; border-radius: 14px; cursor: pointer; font: 600 15px Poppins, sans-serif; color: #fff; background: linear-gradient(135deg, var(--mint), var(--aqua)); }
  .btn.light { background: #eef2f7; color: var(--ink); }
  .btn:disabled { opacity: .6; }
  .login .btn { width: 100%; margin-top: 16px; }
  .msg { margin-top: 12px; font-size: 13px; color: #d0335f; min-height: 18px; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .tools input { flex: 1; min-width: 200px; margin: 0; }
  .count { font-size: 13px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .rec { border: 1.5px solid #edf2f7; border-radius: 18px; padding: 14px; background: #fff; }
  .rec h3 { margin: 0; font-size: 16px; }
  .rec .sub { font-size: 13px; color: var(--muted); margin: 2px 0 8px; }
  .rec dl { margin: 0; display: grid; grid-template-columns: 22px 1fr; gap: 4px 6px; font-size: 13px; }
  .rec dd { margin: 0; word-break: break-word; }
  .rec .imgs { display: flex; gap: 8px; margin-top: 10px; }
  .rec .imgs img { width: 50%; height: 90px; object-fit: cover; border-radius: 10px; cursor: zoom-in; background: #f4f8fc; }
  .rec .when { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .notes { background: #fff8e6; border-radius: 10px; padding: 6px 8px; font-size: 12px; margin-top: 8px; }
  dialog { border: 0; border-radius: 16px; padding: 0; max-width: 95vw; background: #000; }
  dialog img { display: block; max-width: 95vw; max-height: 90vh; }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
</style>
</head>
<body>
<header class="hero"><div class="in">
  <div class="logo"><img src="logo.png" alt="Aquaminder"></div>
  <h1>Admin · Saved investor cards</h1>
  <a href="./">← Scanner</a>
  <button id="logout" hidden>Log out</button>
</div></header>

<main>
  <section class="panel login" id="loginBox">
    <h2>🔒 Admin login</h2>
    <form id="loginForm">
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn" id="loginBtn">Log in</button>
    </form>
    <div class="msg" id="msg"></div>
  </section>

  <section class="panel" id="listBox" hidden>
    <div class="tools">
      <input id="search" placeholder="🔍 Search name, company, phone, email…">
      <button class="btn light" id="csv">⬇️ Download CSV</button>
      <span class="count" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<dialog id="zoom"><img id="zoomImg" alt="Card image"></dialog>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js';
  import { getFirestore, collection, getDocs, getDoc, doc, query, orderBy } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js';

  // Same public web config as the scanner; access is controlled by firestore.rules
  const app = initializeApp({
    apiKey: 'AIzaSyD5FPGrL5rH4Gux9z7KgbMsxjlIsfbkxHU',
    authDomain: 'investor-data-d3a33.firebaseapp.com',
    projectId: 'investor-data-d3a33',
    storageBucket: 'investor-data-d3a33.firebasestorage.app',
    messagingSenderId: '804131945497',
    appId: '1:804131945497:web:c4e31c22c8aa976ecc7e88'
  });
  const auth = getAuth(app), db = getFirestore(app);
  const $ = id => document.getElementById(id);
  let records = [];

  $('loginForm').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    $('loginBtn').disabled = true; $('msg').textContent = '';
    try { await signInWithEmailAndPassword(auth, f.get('email').trim(), f.get('password')); }
    catch (err) {
      $('msg').textContent = /invalid-credential|wrong-password|user-not-found|invalid-email/.test(err.code)
        ? 'Wrong email or password.'
        : /operation-not-allowed|configuration-not-found/.test(err.code)
          ? 'Email/password login is not switched on in Firebase yet (see README).'
          : 'Login failed: ' + err.message;
    } finally { $('loginBtn').disabled = false; }
  };
  $('logout').onclick = () => signOut(auth);

  onAuthStateChanged(auth, async user => {
    $('logout').hidden = !user;
    $('loginBox').hidden = !!user;
    $('listBox').hidden = true;
    if (!user) return;
    try {
      const me = await getDoc(doc(db, 'admins', user.uid));
      if (!me.exists()) throw Object.assign(new Error(), { code: 'not-admin' });
      const snap = await getDocs(query(collection(db, 'investors'), orderBy('createdAt', 'desc')));
      records = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      $('listBox').hidden = false;
      render();
    } catch (err) {
      await signOut(auth);
      $('msg').textContent = err.code === 'not-admin' || err.code === 'permission-denied'
        ? 'This account is not an admin. (Its UID must be added to the "admins" collection, see README.)'
        : 'Could not load records: ' + err.message;
    }
  });

  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const when = r => r.createdAt?.toDate ? r.createdAt.toDate().toLocaleString() : '';
  const safeImg = u => /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(u || '') ? u : '';

  function render() {
    const q = $('search').value.trim().toLowerCase();
    const list = records.filter(r => !q || ['name', 'company', 'designation', 'phone', 'email', 'website', 'notes']
      .some(k => String(r[k] || '').toLowerCase().includes(q)));
    $('count').textContent = list.length + ' of ' + records.length + ' cards';
    $('grid').innerHTML = list.length ? list.map(r => {
      const imgs = [safeImg(r.frontImage), safeImg(r.backImage)].filter(Boolean);
      return `<article class="rec">
        <h3>${esc(r.name) || '<i>No name</i>'}</h3>
        <div class="sub">${esc([r.designation, r.company].filter(Boolean).join(' · '))}</div>
        <dl>
          ${r.phone ? `<dt>📞</dt><dd><a href="tel:${esc(r.phone.split(' / ')[0].replace(/[^\d+]/g, ''))}">${esc(r.phone)}</a></dd>` : ''}
          ${r.email ? `<dt>✉️</dt><dd><a href="mailto:${esc(r.email)}">${esc(r.email)}</a></dd>` : ''}
          ${r.website ? `<dt>🌐</dt><dd>${esc(r.website)}</dd>` : ''}
          ${r.address ? `<dt>📍</dt><dd>${esc(r.address)}</dd>` : ''}
        </dl>
        ${r.notes ? `<div class="notes">📝 ${esc(r.notes)}</div>` : ''}
        ${imgs.length ? `<div class="imgs">${imgs.map(u => `<img src="${u}" alt="Card image" loading="lazy">`).join('')}</div>` : ''}
        <div class="when">${esc(when(r))}</div>
      </article>`;
    }).join('') : '<p class="empty">No cards found.</p>';
  }
  $('search').oninput = render;

  $('grid').onclick = e => {
    if (e.target.tagName !== 'IMG') return;
    $('zoomImg').src = e.target.src; $('zoom').showModal();
  };
  $('zoom').onclick = () => $('zoom').close();

  // Spreadsheet export (details only, no images). Leading = + - @ are neutralised so Excel won't run formulas.
  $('csv').onclick = () => {
    const cols = ['name', 'designation', 'company', 'phone', 'email', 'website', 'address', 'notes'];
    const cell = v => { let s = String(v ?? ''); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
    const rows = [['saved', ...cols], ...records.map(r => [when(r), ...cols.map(k => r[k])])];
    const blob = new Blob(['﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'aquaminder-investors.csv' });
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
</script>
</body>
</html>
