<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a84d6">
<title>Aquaminder Investor Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --aqua: #1ba1e2; --deep: #0a5bd6; --violet: #7b5cff; --pink: #ff5c9a; --mint: #19c39c; --sun: #ffb020;
    --ink: #13223a; --muted: #6b7a90; --bg: #eef6fc; --card: #fff; --line: #dbe7f2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: Poppins, system-ui, sans-serif; color: var(--ink); background: var(--bg); min-height: 100vh; }

  /* Hero */
  .hero {
    position: relative; overflow: hidden; color: #fff; text-align: center;
    padding: 22px 16px 86px;
    background: linear-gradient(135deg, #00c6ff 0%, #0a84d6 45%, #6a5cff 100%);
    border-radius: 0 0 32px 32px;
  }
  .hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.12); }
  .hero::before { width: 260px; height: 260px; top: -120px; right: -80px; }
  .hero::after { width: 180px; height: 180px; bottom: -70px; left: -50px; }
  .logo { position: relative; z-index: 1; display: inline-block; background: #fff; padding: 10px 18px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  .logo img { display: block; height: 34px; }
  .hero h1 { position: relative; z-index: 1; margin: 16px 0 2px; font-size: 22px; font-weight: 700; }
  .hero p { position: relative; z-index: 1; margin: 0; opacity: .9; font-size: 14px; }

  main { max-width: 520px; margin: -64px auto 0; padding: 0 16px 120px; position: relative; z-index: 2; }

  /* Scan card */
  .scan { background: var(--card); border-radius: 24px; padding: 20px; box-shadow: 0 12px 32px rgba(10,91,214,.15); text-align: center; }
  .scan-btn {
    display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%;
    padding: 18px; border: 0; border-radius: 18px; cursor: pointer;
    font: 600 18px Poppins, sans-serif; color: #fff;
    background: linear-gradient(135deg, #ff5c9a, #ff8a3d);
    box-shadow: 0 10px 24px rgba(255,92,154,.4);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .scan-btn:active { transform: scale(.98); }
  .scan-btn .ico { font-size: 26px; }
  @keyframes pulse { 0%,100% { box-shadow: 0 10px 24px rgba(255,92,154,.35); } 50% { box-shadow: 0 10px 34px rgba(255,92,154,.65); } }
  @media (prefers-reduced-motion: reduce) { .scan-btn { animation: none; } }
  .gallery { display: inline-block; margin-top: 12px; color: var(--deep); font-weight: 500; font-size: 14px; cursor: pointer; }
  .gallery:hover { text-decoration: underline; }

  #preview { display: none; width: 100%; max-height: 220px; object-fit: contain; margin-top: 16px; border-radius: 14px; background: #f4f8fc; }
  .progress { display: none; height: 8px; margin-top: 14px; border-radius: 99px; background: #e6eef7; overflow: hidden; }
  .progress div { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--mint), var(--aqua), var(--violet)); transition: width .3s; }
  #status { margin-top: 10px; min-height: 20px; font-size: 14px; color: var(--muted); }

  /* Form */
  .details { margin-top: 18px; background: var(--card); border-radius: 24px; padding: 18px 18px 8px; box-shadow: 0 8px 24px rgba(19,34,58,.07); }
  .details h2 { margin: 0 0 4px; font-size: 17px; }
  .details .hint { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .field { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0f4f8; }
  .field:last-child { border-bottom: 0; }
  .chip { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 19px; margin-top: 2px; }
  .field label { flex: 1; font-size: 12px; font-weight: 500; color: var(--muted); }
  .field input, .field textarea {
    display: block; width: 100%; margin-top: 4px; padding: 10px 12px;
    border: 1.5px solid var(--line); border-radius: 12px; background: #fbfdff;
    font: 15px Poppins, sans-serif; color: var(--ink); resize: vertical;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--aqua); box-shadow: 0 0 0 4px rgba(27,161,226,.15); background: #fff; }
  .field input.filled, .field textarea.filled { background: #effbf6; border-color: #a6e6cf; }
  .c1 { background: #e5f4ff; } .c2 { background: #efeaff; } .c3 { background: #fff1e0; } .c4 { background: #e3f9f1; }
  .c5 { background: #ffe8f1; } .c6 { background: #e7f0ff; } .c7 { background: #fff7d6; } .c8 { background: #f0f0f5; }

  /* Bottom bar */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.92); backdrop-filter: blur(10px); box-shadow: 0 -6px 20px rgba(19,34,58,.08); }
  .bar .inner { max-width: 520px; margin: 0 auto; display: flex; gap: 10px; }
  .btn { flex: 1; padding: 15px; border: 0; border-radius: 16px; cursor: pointer; font: 600 16px Poppins, sans-serif; }
  .btn.clear { flex: 0 0 34%; background: #eef2f7; color: var(--ink); }
  .btn.save { color: #fff; background: linear-gradient(135deg, var(--mint), var(--aqua)); box-shadow: 0 8px 20px rgba(25,195,156,.35); }
  .btn:disabled { opacity: .6; }

  .toast { position: fixed; left: 50%; top: 18px; z-index: 10; transform: translate(-50%, -120px); padding: 12px 20px; border-radius: 14px; color: #fff; font-weight: 500; box-shadow: 0 10px 24px rgba(0,0,0,.2); transition: transform .35s; }
  .toast.show { transform: translate(-50%, 0); }
  .toast.ok { background: linear-gradient(135deg, var(--mint), #0fa37f); }
  .toast.err { background: linear-gradient(135deg, #ff5c5c, #e0336b); }
</style>
</head>
<body>
<header class="hero">
  <div class="logo"><img src="logo.png" alt="Aquaminder"></div>
  <h1>Investor Card Scanner</h1>
  <p>Snap a visiting card · details fill in automatically</p>
</header>

<main>
  <section class="scan">
    <label class="scan-btn" for="cam"><span class="ico">📸</span> Scan Visiting Card</label>
    <input id="cam" type="file" accept="image/*" capture="environment" hidden>
    <label class="gallery" for="pick">🖼️ or choose a photo from gallery</label>
    <input id="pick" type="file" accept="image/*" hidden>
    <img id="preview" alt="Scanned card">
    <div class="progress" id="progress"><div></div></div>
    <div id="status"></div>
  </section>

  <form id="form" class="details" autocomplete="off">
    <h2>Investor details</h2>
    <p class="hint">Scan a card or type in manually. Check everything before saving.</p>
    <div class="field"><span class="chip c1">👤</span><label>Name<input name="name" placeholder="Full name"></label></div>
    <div class="field"><span class="chip c2">💼</span><label>Designation<input name="designation" placeholder="e.g. Managing Partner"></label></div>
    <div class="field"><span class="chip c3">🏢</span><label>Company<input name="company" placeholder="Firm / fund name"></label></div>
    <div class="field"><span class="chip c4">📞</span><label>Phone<input name="phone" type="tel" placeholder="+91 …"></label></div>
    <div class="field"><span class="chip c5">✉️</span><label>Email<input name="email" type="email" placeholder="name@company.com"></label></div>
    <div class="field"><span class="chip c6">🌐</span><label>Website<input name="website" placeholder="www.company.com"></label></div>
    <div class="field"><span class="chip c7">📍</span><label>Address<textarea name="address" rows="2" placeholder="Office address"></textarea></label></div>
    <div class="field"><span class="chip c8">📝</span><label>Notes<textarea name="notes" rows="2" placeholder="Met at…, interested in…"></textarea></label></div>
  </form>
</main>

<div class="bar"><div class="inner">
  <button type="button" class="btn clear" id="reset">Clear</button>
  <button type="submit" class="btn save" id="save" form="form">💾 Save to Sheet</button>
</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="parse.js"></script>
<script>
  // Paste your Apps Script Web App URL here (see README.md)
  const SHEET_URL = 'PASTE_APPS_SCRIPT_URL_HERE';
  const TOKEN = 'aquaminder-2026'; // must match TOKEN in apps-script/Code.gs

  const $ = id => document.getElementById(id);
  const form = $('form');
  const bar = $('progress').firstElementChild;
  let rawText = '';

  // Fix rotation, resize to a size OCR likes, grayscale + contrast. Biggest accuracy win for phone photos.
  async function prepImage(file) {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const s = 2000 / Math.max(bmp.width, bmp.height);
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    const ctx = c.getContext('2d');
    ctx.filter = 'grayscale(1) contrast(1.5) brightness(1.05)'; // ignored on old Safari, still works
    ctx.drawImage(bmp, 0, 0, c.width, c.height);
    return c;
  }

  function toast(msg, type) {
    const t = $('toast'); t.textContent = msg; t.className = 'toast show ' + type;
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3000);
  }

  function markFilled() {
    for (const el of form.elements) if (el.name) el.classList.toggle('filled', !!el.value.trim());
  }
  form.addEventListener('input', markFilled);

  async function scan(e) {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    $('preview').src = URL.createObjectURL(file);
    $('preview').style.display = 'block';
    $('progress').style.display = 'block'; bar.style.width = '5%';
    $('status').textContent = '✨ Reading card…';
    try {
      const img = await prepImage(file);
      const { data } = await Tesseract.recognize(img, 'eng', {
        logger: m => m.status === 'recognizing text' && (bar.style.width = Math.max(5, m.progress * 100) + '%')
      });
      rawText = data.text;
      const fields = parseCard(rawText);
      for (const [k, v] of Object.entries(fields)) form.elements[k].value = v;
      markFilled();
      const found = Object.values(fields).filter(Boolean).length;
      $('status').textContent = found ? `✅ Found ${found} details. Please check and fix if needed.` : '⚠️ Couldn\'t read much. Try a sharper, well-lit photo.';
      form.scrollIntoView({ behavior: 'smooth' });
    } catch (err) {
      $('status').textContent = '❌ Could not read card: ' + err.message;
    } finally {
      $('progress').style.display = 'none';
    }
  }
  $('cam').onchange = scan;
  $('pick').onchange = scan;

  form.onsubmit = async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form));
    if (!data.name && !data.phone && !data.email) return toast('Enter at least a name, phone or email', 'err');
    if (SHEET_URL.startsWith('PASTE')) return toast('Google Sheet not connected yet (SHEET_URL)', 'err');
    $('save').disabled = true; $('save').textContent = 'Saving…';
    try {
      // text/plain avoids a CORS preflight, which Apps Script can't answer
      const res = await fetch(SHEET_URL, { method: 'POST', body: JSON.stringify({ ...data, rawText, token: TOKEN }) });
      const out = await res.json();
      if (!out.ok) throw new Error(out.error);
      toast('✅ Saved to Google Sheet', 'ok');
      resetAll();
    } catch (err) {
      toast('Not saved: ' + err.message, 'err');
    } finally {
      $('save').disabled = false; $('save').textContent = '💾 Save to Sheet';
    }
  };

  function resetAll() {
    form.reset(); markFilled(); rawText = '';
    $('preview').style.display = 'none'; $('status').textContent = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  $('reset').onclick = resetAll;
</script>
</body>
</html>
